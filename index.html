<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>💰 Expense Tracker</h1>

        <!-- Budget Section -->
        <section class="budget-section">
            <h2>Set Monthly Budget</h2>

            <input
                type="text"
                id="budget"
                placeholder="Enter Monthly Budget">

            <button id="setBudgetBtn">Set Budget</button>
        </section>

        <hr>

        <!-- Expense Form -->
        <section class="expense-form">

            <h2>Add New Expense</h2>

            <label for="amount">Amount</label>
            <input
                type="number"
                id="amount"
                placeholder="Enter Amount">

            <label for="reason">Reason</label>
            <input
                type="text"
                id="reason"
                placeholder="Enter Reason">

            <label for="category">Category</label>
            <select id="category">
                <option value="">Select Category</option>
                <option>Food</option>
                <option>Transport</option>
                <option>Shopping</option>
                <option>Bills</option>
                <option>Entertainment</option>
                <option>Medical</option>
                <option>Education</option>
                <option>Rent</option>
                <option>Others</option>
            </select>

            <label for="date">Date</label>
            <input type="date" id="date">

            <button id="addExpenseBtn">Add Expense</button>

        </section>

        <hr>

        <!-- Search & Filter -->
        <section class="filter-section">

            <h2>Search & Filter</h2>

            <input
                type="text"
                id="search"
                placeholder="Search by reason">

            <select id="filterCategory">
                <option value="All">All Categories</option>
                <option>Food</option>
                <option>Transport</option>
                <option>Shopping</option>
                <option>Bills</option>
                <option>Entertainment</option>
                <option>Medical</option>
                <option>Education</option>
                <option>Rent</option>
                <option>Others</option>
            </select>

        </section>

        <hr>

        <!-- Summary -->
        <section class="summary">

            <h2>Expense Summary</h2>

            <p><strong>Budget:</strong> ₹<span id="budgetDisplay">0</span></p>

            <p><strong>Total Spent:</strong> ₹<span id="spentDisplay">0</span></p>

            <p><strong>Remaining:</strong> ₹<span id="remainingDisplay">0</span></p>

        </section>

        <hr>

        <!-- Expense List -->
        <section class="expense-list">

            <h2>Expense History</h2>

            <table>

                <thead>

                    <tr>
                        <th>Amount</th>
                        <th>Reason</th>
                        <th>Category</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="expenseTableBody">

                    <!-- Expenses will be added here using JavaScript -->

                </tbody>

            </table>

        </section>

        <br>

        <button id="clearAllBtn">Clear All Expenses</button>

    </div>

    <!-- JavaScript File -->
    <script src="script.js"></script>

</body>
</html>
